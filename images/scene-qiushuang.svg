<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300">
  <defs><linearGradient id="s6bg" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#f8f2e8"/><stop offset="100%" style="stop-color:#f0e8d8"/></linearGradient></defs>
  <rect width="500" height="300" fill="url(#s6bg)"/>
  <!-- Calligraphy brushes and ink -->
  <g transform="translate(300,80)">
    <rect x="0" y="0" width="60" height="8" fill="#3d2b1f" rx="2"/><!-- ink stone -->
    <line x1="80" y1="-20" x2="80" y2="30" stroke="#5c3d1f" stroke-width="3"/><!-- brush -->
    <path d="M78 30 Q80 40 82 30" fill="#2d1f0f"/><!-- brush tip -->
    <rect x="100" y="-5" width="40" height="50" fill="#f5f0e0" stroke="#c4a882" stroke-width="1"/><!-- paper -->
  </g>
  <!-- Open hall -->
  <rect x="50" y="120" width="400" height="160" fill="none" stroke="#8b6b4a" stroke-width="2"/>
  <line x1="50" y1="120" x2="250" y2="80" stroke="#6b4423" stroke-width="2.5"/>
  <line x1="450" y1="120" x2="250" y2="80" stroke="#6b4423" stroke-width="2.5"/>
  <!-- Scrolls on wall -->
  <rect x="100" y="140" width="30" height="80" fill="#f5f0e0" stroke="#c4a882" stroke-width="1"/>
  <rect x="370" y="140" width="30" height="80" fill="#f5f0e0" stroke="#c4a882" stroke-width="1"/>
</svg>
